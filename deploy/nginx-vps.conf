# Replace ASCHE_HOST before installing. Certbot adds HTTPS afterward.
server {
    listen 80;
    listen [::]:80;
    server_name ASCHE_HOST;
    root /var/www/asche;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    # same-site lets sibling subdomains (the Flashcards desktop) frame the
    # game while genuinely different sites still cannot load it.
    add_header Cross-Origin-Resource-Policy same-site always;
    location / { try_files $uri $uri/ =404; }
}
